<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Certificado — Franci Kohler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #f5f5f5;
    padding: 30px;
  }

  .controls {
    max-width: 900px;
    margin: 0 auto 24px;
    background: white;
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .controls h2 {
    grid-column: 1/-1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: #3D2E1E;
    margin-bottom: 4px;
  }

  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-group label { font-size: 11px; font-weight: 500; color: #8A7060; letter-spacing: 0.05em; text-transform: uppercase; }
  .ctrl-group input, .ctrl-group select {
    padding: 8px 10px;
    border: 1px solid #E8D9C5;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Montserrat', sans-serif;
    color: #3D2E1E;
    outline: none;
  }
  .ctrl-group input:focus, .ctrl-group select:focus { border-color: #D2AA82; }

  .btn-row { grid-column: 1/-1; display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: 'Montserrat', sans-serif;
  }
  .btn-primary { background: #D2AA82; color: white; }
  .btn-primary:hover { background: #B8895E; }
  .btn-outline { background: transparent; border: 1px solid #E8D9C5; color: #8A7060; }
  .btn-outline:hover { border-color: #D2AA82; }

  /* CERTIFICATE */
  .cert-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .certificate {
    background: #FAFAF7;
    width: 100%;
    aspect-ratio: 297/210;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 32px rgba(0,0,0,0.15);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6%;
  }

  /* Floral decoration - CSS art approximating the Canva design */
  .floral-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 38%;
    background:
      radial-gradient(ellipse 120px 80px at 15% 20%, rgba(180,200,160,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 100px 70px at 5% 40%, rgba(160,185,140,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 90px 60px at 25% 10%, rgba(200,215,180,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 120px 80px at 85% 20%, rgba(180,200,160,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 100px 70px at 95% 40%, rgba(160,185,140,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 90px 60px at 75% 10%, rgba(200,215,180,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 80px 50px at 50% 5%, rgba(245,240,230,0.5) 0%, transparent 60%);
    /* White flowers suggestion */
  }

  /* Flower petals using CSS */
  .petal {
    position: absolute;
    border-radius: 50% 50% 50% 0;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(220,215,205,0.6);
  }

  .logo-circle {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 13%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #C8B89A;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 10;
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .cert-content {
    position: relative;
    z-index: 5;
    text-align: center;
    width: 100%;
    padding: 0 8%;
  }

  .cert-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.2vw;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #1a1a1a;
    margin-bottom: 1.5%;
  }

  .cert-title em {
    font-family: 'Great Vibes', cursive;
    font-style: normal;
    font-size: 2.8vw;
    letter-spacing: 0.05em;
  }

  .cert-certifica {
    font-family: 'Montserrat', sans-serif;
    font-size: 1vw;
    font-weight: 300;
    color: #444;
    margin-bottom: 1%;
  }

  .cert-name {
    font-family: 'Great Vibes', cursive;
    font-size: 4.2vw;
    color: #1a1a1a;
    line-height: 1.2;
    margin: 0.3% 0;
  }

  .cert-ampersand {
    font-family: 'Great Vibes', cursive;
    font-size: 3vw;
    color: #1a1a1a;
    margin: 0.2% 0;
  }

  .cert-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95vw;
    font-weight: 300;
    color: #333;
    margin-top: 1.5%;
    line-height: 1.6;
  }

  .cert-signatures {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    width: 80%;
    margin: 3% auto 0;
    position: relative;
  }

  .sig-line {
    text-align: center;
    min-width: 22%;
  }

  .sig-line hr {
    border: none;
    border-top: 1px solid #1a1a1a;
    margin-bottom: 6px;
    width: 100%;
  }

  .sig-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7vw;
    letter-spacing: 0.2em;
    color: #333;
    font-weight: 400;
  }

  .sig-heart {
    text-align: center;
    font-size: 1.4vw;
    color: #C8B89A;
    padding-bottom: 4px;
  }

  /* Print */
  @media print {
    body { background: white; padding: 0; }
    .controls { display: none; }
    .certificate { box-shadow: none; aspect-ratio: 297/210; }
  }
</style>
</head>
<body>

<div class="cert-wrap">
  <!-- CONTROLS -->
  <div class="controls">
    <h2>Gerar Certidão / Certificado</h2>

    <div class="ctrl-group">
      <label>Tipo de cerimônia</label>
      <select id="c-type" onchange="updateCert()">
        <option value="wedding">Casamento</option>
        <option value="renewal">Renovação de Votos</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Gênero</label>
      <select id="c-gender" onchange="updateCert()">
        <option value="mf">Noiva + Noivo (mulher + homem)</option>
        <option value="ff">Noiva + Noiva (mulher + mulher)</option>
        <option value="mm">Noivo + Noivo (homem + homem)</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Nome completo — Noivo(a) 1</label>
      <input id="c-name1" type="text" placeholder="Nome completo" oninput="updateCert()">
    </div>

    <div class="ctrl-group">
      <label>Nome completo — Noivo(a) 2</label>
      <input id="c-name2" type="text" placeholder="Nome completo" oninput="updateCert()">
    </div>

    <div class="ctrl-group">
      <label>Data do evento</label>
      <input id="c-date" type="date" oninput="updateCert()">
    </div>

    <div class="ctrl-group">
      <label>Local</label>
      <input id="c-loc" type="text" placeholder="ex: Krabi" oninput="updateCert()">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="window.print()">🖨 Imprimir / Salvar PDF</button>
      <button class="btn btn-outline" onclick="resetForm()">Limpar</button>
    </div>
  </div>

  <!-- CERTIFICATE -->
  <div class="certificate" id="certificate">
    <!-- Decorative background -->
    <div class="floral-top"></div>

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function updateCert() {
  const type = document.getElementById('c-type').value;
  const gender = document.getElementById('c-gender').value;
  const name1 = document.getElementById('c-name1').value || 'Nome Completo';
  const name2 = document.getElementById('c-name2').value || 'Nome Completo';
  const dateVal = document.getElementById('c-date').value;
  const loc = document.getElementById('c-loc').value || '____';

  // Title
  const titleEl = document.getElementById('cert-title');
  if(type === 'wedding') {
    titleEl.innerHTML = 'C E R T I D &Atilde; O &nbsp;<em>de</em>&nbsp; C A S A M E N T O';

    titleEl.innerHTML = 'R E N O V A &Ccedil; &Atilde; O &nbsp;<em>de</em>&nbsp; V O T O S';
  }

  // Names
  document.getElementById('cert-name1').textContent = name1;
  document.getElementById('cert-name2').textContent = name2;

  // Body text
  const textEl = document.getElementById('cert-text');
  if(type === 'wedding') {
    textEl.innerHTML = 'uniram-se em casamento no dia<br><span id="cert-date"></span>, em <span id="cert-loc"></span>, na Tail&acirc;ndia.';
  } else {
    textEl.innerHTML = 'renovaram seus votos de casamento no dia<br><span id="cert-date"></span>, em <span id="cert-loc"></span>, na Tail&acirc;ndia.';
  }

  let dateStr = '__ de ______ de ____';
  if(dateVal) {
    const d = new Date(dateVal + 'T12:00:00');
    dateStr = d.getDate() + ' de ' + MONTHS_PT[d.getMonth()] + ' de ' + d.getFullYear();
  }
  document.getElementById('cert-date').textContent = dateStr;
  document.getElementById('cert-loc').textContent = loc;

  // Signature labels
  const sig1 = document.getElementById('sig1-label');
  const sig2 = document.getElementById('sig2-label');
  const sigCel = document.getElementById('sig-celebrante');
  const sigHeart2 = document.getElementById('sig-heart2');

  if(gender === 'ff') { sig1.textContent = 'N O I V A'; sig2.textContent = 'N O I V A'; }
  else if(gender === 'mm') { sig1.textContent = 'N O I V O'; sig2.textContent = 'N O I V O'; }
  else { sig1.textContent = 'N O I V A'; sig2.textContent = 'N O I V O'; }

  // Show celebrante line only for wedding
  if(type === 'wedding') {
    sigCel.style.display = 'block';
    sigHeart2.style.display = 'block';
  } else {
    sigCel.style.display = 'none';
    sigHeart2.style.display = 'none';
  }
}

function resetForm() {
  ['c-name1','c-name2','c-date','c-loc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('c-type').value = 'wedding';
  document.getElementById('c-gender').value = 'mf';
  updateCert();
}

// Read URL params to pre-fill from event
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('name1')) document.getElementById('c-name1').value = urlParams.get('name1');
if(urlParams.get('name2')) document.getElementById('c-name2').value = urlParams.get('name2');
if(urlParams.get('date')) document.getElementById('c-date').value = urlParams.get('date');
if(urlParams.get('loc')) document.getElementById('c-loc').value = urlParams.get('loc');
if(urlParams.get('type')) document.getElementById('c-type').value = urlParams.get('type');
updateCert();
</script>
