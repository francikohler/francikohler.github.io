<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Certidão — Franci Kohler</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:#e8e2d9;padding:20px;}

.controls{
  max-width:980px;margin:0 auto 20px;
  background:#3D2E1E;border-radius:10px;
  padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
}
.ctrl{display:flex;flex-direction:column;gap:3px;}
.ctrl label{font-size:10px;color:#D2AA82;letter-spacing:0.08em;text-transform:uppercase;}
.ctrl input,.ctrl select{
  padding:7px 10px;border:1px solid rgba(210,170,130,0.4);border-radius:5px;
  font-size:13px;font-family:'Montserrat',sans-serif;color:#3D2E1E;background:#FAF7F3;outline:none;
}
.ctrl input:focus,.ctrl select:focus{border-color:#D2AA82;}
.ctrl-wide{min-width:200px;}
.btn-print{
  padding:9px 20px;background:#D2AA82;color:white;border:none;border-radius:6px;
  font-size:13px;font-weight:500;cursor:pointer;font-family:'Montserrat',sans-serif;
  white-space:nowrap;
}
.btn-print:hover{background:#B8895E;}

/* Certificate container */
.cert-wrap{max-width:980px;margin:0 auto;position:relative;}
.cert-container{
  position:relative;width:100%;
  aspect-ratio:2000/1414;
  overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,0.25);
}
.cert-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}

/* Text overlay — positioned as percentages of container */
.overlay{
  position:absolute;inset:0;
  pointer-events:none;
}

/* Name 1 — below "Este documento certifica que" */
.name1{
  position:absolute;
  top:46%;left:50%;transform:translateX(-50%);
  font-family:'Dancing Script',cursive;
  font-size:4.2vw;
  color:#1a1a1a;
  white-space:nowrap;
  text-align:center;
  max-width:80%;
}
/* Name 2 — below & */
.name2{
  position:absolute;
  top:57%;left:50%;transform:translateX(-50%);
  font-family:'Dancing Script',cursive;
  font-size:4.2vw;
  color:#1a1a1a;
  white-space:nowrap;
  text-align:center;
  max-width:80%;
}
/* Body sentence */
.body-text{
  position:absolute;
  top:72%;left:50%;transform:translateX(-50%);
  font-family:'Montserrat',sans-serif;
  font-size:1.05vw;
  font-weight:400;
  color:#1a1a1a;
  white-space:nowrap;
  text-align:center;
}
/* Wedding only: body sentence is higher since renewal already has partial text baked in */
.body-text-wedding{
  position:absolute;
  top:67%;left:50%;transform:translateX(-50%);
  font-family:'Montserrat',sans-serif;
  font-size:1.05vw;
  font-weight:400;
  color:#1a1a1a;
  white-space:nowrap;
  text-align:center;
  line-height:1.8;
  text-align:center;
}

@media print{
  body{background:white;padding:0;}
  .controls{display:none;}
  .cert-wrap{max-width:100%;}
  .cert-container{box-shadow:none;}
  @page{size:A4 landscape;margin:0;}
}
</style>
</head>
<body>

<div class="cert-wrap">
<div class="controls">
  <div class="ctrl">
    <label>Tipo</label>
    <select id="c-type" onchange="update()">
      <option value="wedding">Certidão de Casamento</option>
      <option value="renewal">Renovação de Votos</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Gênero</label>
    <select id="c-gender" onchange="update()">
      <option value="mf">Noiva + Noivo</option>
      <option value="ff">Noiva + Noiva</option>
      <option value="mm">Noivo + Noivo</option>
    </select>
  </div>
  <div class="ctrl ctrl-wide">
    <label>Nome — Noivo(a) 1</label>
    <input id="c-n1" type="text" placeholder="Nome completo" oninput="update()">
  </div>
  <div class="ctrl ctrl-wide">
    <label>Nome — Noivo(a) 2</label>
    <input id="c-n2" type="text" placeholder="Nome completo" oninput="update()">
  </div>
  <div class="ctrl">
    <label>Data</label>
    <input id="c-date" type="date" oninput="update()">
  </div>
  <div class="ctrl">
    <label>Local</label>
    <input id="c-loc" type="text" placeholder="ex: Krabi" oninput="update()">
  </div>
  <button class="btn-print" onclick="window.print()">🖨 Imprimir / PDF</button>
</div>

  document.getElementById('cert-n1').textContent = n1;
  document.getElementById('cert-n2').textContent = n2;

  // Date string
  let dateStr = '';
  if(dateVal) {
    const d = new Date(dateVal + 'T12:00:00');
    dateStr = d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
  }
  const locStr = loc || '____';

  // Body text
  const bodyEl = document.getElementById('cert-body');
  if(type === 'wedding') {
    // Wedding template has NO body sentence — add full sentence
    bodyEl.className = 'body-text-wedding';
    bodyEl.innerHTML = 'uniram-se em casamento no dia ' + (dateStr || '__ de ______ de ____') + ',<br>em ' + locStr + ', na Tailândia.';
  } else {
    // Renewal template already has "renovaram seus votos de casamento no dia" baked in
    // Only add the date + location line
    bodyEl.className = 'body-text';
    bodyEl.textContent = (dateStr || '__ de ______ de ____') + ', em ' + locStr + ', na Tailândia.';
  }
}

// URL params pre-fill
const p = new URLSearchParams(window.location.search);
if(p.get('name1')) document.getElementById('c-n1').value = p.get('name1');
if(p.get('name2')) document.getElementById('c-n2').value = p.get('name2');
if(p.get('date')) document.getElementById('c-date').value = p.get('date');
if(p.get('loc')) document.getElementById('c-loc').value = p.get('loc');
if(p.get('type')) document.getElementById('c-type').value = p.get('type');
update();
</script>
</body>
</html>
